<!DOCTYPE html> 
<html lang="pt-BR"> 
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Cadastro de Alunos - Curso de Informática</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body>

    <div class="form-container"> <!-- Cria uma caixa para agrupar e limitar visualmente o formulario -->


        <h1>Inscrição no Curso de Informática</h1> <!-- Titulo principal do topo do formulario -->

        <p>Preencha os dados abaixo para solicitar a sua vaga.</p> <!-- Texto explicativo abaixo do titulo -->

        <!-- Inicia o formulário; define que os dados nao vao para nenhum link externo (#) via metodo seguro (POST) e aceita arquivos -->
        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- 1. Nome Completo -->
            <div class="form-group"> <!-- Agrupa o rotulo e o campo de digitacao do nome -->

                <label for="nome">Nome Completo: *</label> <!-- Rotulo de texto conectado ao input do nome -->

                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required> <!-- Campo para digitar texto, obrigatorio -->

            </div> <!-- Fecha o grupo do nome -->

            <!-- 2. E-mail -->
            <div class="form-group"> <!-- Agrupa o rotulo e o campo de digitacao do e-mail -->

                <label for="email">E-mail: *</label> <!-- Rotulo de texto conectado ao input do e-mail -->

                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required> <!-- Campo exclusivo para e-mails validos, obrigatorio -->

            </div> <!-- Fecha o grupo do e-mail -->

            <!-- 3. Data de Nascimento -->
            <div class="form-group"> <!-- Agrupa o rotulo e o campo da data de nascimento -->

                <label for="nascimento">Data de Nascimento: *</label> <!-- Rotulo de texto conectado ao input da data -->

                <input type="Data de Nascimento" id="Data de Nascimento" name="Data de Nascimento" placeholder="Data de Nascimento com /" required> <!-- Abre um calendario nativo para escolher a data, obrigatorio -->

            </div> <!-- Fecha o grupo da data -->

            <!-- 4. Telefone -->
            <div class="form-group"> <!-- Agrupa o rotulo e o campo de digitacao do telefone -->

                <label for="telefone">Telefone: *</label> <!-- Rotulo de texto conectado ao input do telefone -->

                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required> <!-- Campo otimizado para numeros de telefone, obrigatorio -->

            </div> <!-- Fecha o grupo do telefone -->

            <!-- 5. Senha -->
            <div class="form-group"> <!-- Agrupa o rotulo e o campo de digitacao da senha -->

                <label for="senha">Senha: *</label> <!-- Rotulo de texto conectado ao input da senha -->

                <input type="password" id="senha" name="senha" minlength="6" placeholder="Crie uma senha" required> <!-- Campo que oculta os caracteres digitados, exige no minimo 6 letras/numeros, obrigatorio -->
            </div> <!-- Fecha o grupo da senha -->

            <!-- Desafio Extra: Cidade -->
            <div class="form-group"> <!-- Agrupa o rotulo e o campo de digitacao da cidade -->

                <label for="cidade">Cidade: *</label> <!-- Rotulo de texto conectado ao input da cidade -->

                <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required> <!-- Campo para digitar texto simples, obrigatorio -->
            </div> <!-- Fecha o grupo da cidade -->

            <!-- Desafio Extra: Cor Favorita -->
            <div class="form-group"> <!-- Agrupa o rotulo e o seletor de cor -->

                <label for="cor">Cor Favorita:</label> <!-- Rotulo de texto conectado ao input da cor -->

                <input type="color" id="cor" name="cor" value="#4A90E2"> <!-- Abre uma paleta de cores com um tom azul definido por padrao -->

            </div> <!-- Fecha o grupo da cor -->

            <!-- Desafio Extra: Upload de Foto -->
            <div class="form-group"> <!-- Agrupa o rotulo e o campo de envio de arquivo -->

                <label for="foto">Foto de Perfil:</label> <!-- Rotulo de texto conectado ao input da foto -->

                <input type="file" id="foto" name="foto" accept="image/*"> <!-- Botao para carregar arquivos do computador, limitado apenas a imagens -->

            </div> <!-- Fecha o grupo da foto -->

            <!-- 6. Curso de Interesse -->
            <div class="form-group"> <!-- Agrupa o rotulo e a lista de selecao de cursos -->

                <label for="curso">Curso de Interesse: *</label> <!-- Rotulo de texto conectado a lista de selecao -->

                <select id="curso" name="curso" required> <!-- Abre a lista de selecao suspensa, obrigatoria -->
                    
                    <option value="" disabled selected>Selecione um curso...</option> <!-- Opcao inicial desativada que serve apenas como instrucao -->

                    <option value="desenvolvimento">Técnico em Desenvolvimento de Sistemas</option> <!-- Opcao de curso disponivel para selecao -->

                    <option value="eletrotecnica">Técnico em Eletrotécnica</option> <!-- Opcao de curso disponivel para selecao -->

                    <option value="informatica_basica">Informática Básica</option> <!-- Opcao de curso disponivel para selecao -->
                </select> <!-- Fecha a lista de selecao suspensa -->
            </div> <!-- Fecha o grupo do curso -->

            <!-- 7. Turno (Radio) -->
            <div class="form-group"> <!-- Agrupa o rotulo principal e as opcoes de botoes de radio -->

                <label>Turno de Preferência: *</label> <!-- Rotulo do grupo de turnos -->

                <div class="radio-group"> <!-- Caixa interna para alinhar os botoes de opcao via CSS -->

                    <label> <!-- Rotulo que envolve o primeiro botao para permitir clicar no texto -->

                        <input type="radio" name="turno" value="manha" required> Manhã <!-- Botao de escolha unica para o periodo matutino, obrigatorio -->

                    </label> <!-- Fecha o rotulo da opcao manha -->

                    <label> <!-- Rotulo que envolve o segundo botao -->

                        <input type="radio" name="turno" value="tarde"> Tarde <!-- Botao de escolha unica para o periodo vespertino do mesmo grupo "turno" -->

                    </label> <!-- Fecha o rotulo da opcao tarde -->

                    <label> <!-- Rotulo que envolve o terceiro botao -->

                        <input type="radio" name="turno" value="noite"> Noite <!-- Botao de escolha unica para o periodo noturno do mesmo grupo "turno" -->

                    </label> <!-- Fecha o rotulo da opcao noite -->

                </div> <!-- Fecha a caixa do grupo de botoes de radio -->

            </div> <!-- Fecha o grupo geral do turno -->


            <!-- 8. Conhecimentos Previos (Checkbox) -->

            <div class="form-group"> <!-- Agrupa o rotulo principal e as caixas de selecao multipla -->

                <label>Conhecimentos Prévios:</label> <!-- Rotulo do grupo de conhecimentos -->

                <div class="checkbox-group"> <!-- Caixa interna para alinhar as caixas de selecao via CSS -->

                    <label> <!-- Rotulo da primeira caixa de selecao -->

                        <input type="checkbox" name="conhecimentos" value="html"> HTML <!-- Caixa de multipla escolha para a opcao HTML -->

                    </label> <!-- Fecha o rotulo do HTML -->

                    <label> <!-- Rotulo da segunda caixa de selecao -->

                        <input type="checkbox" name="conhecimentos" value="css"> CSS <!-- Caixa de multipla escolha para a opcao CSS -->

                    </label> <!-- Fecha o rotulo do CSS -->

                    <label> <!-- Rotulo da terceira caixa de selecao -->

                        <input type="checkbox" name="conhecimentos" value="javascript"> JavaScript <!-- Caixa de multipla escolha para a opcao JavaScript -->

                    </label> <!-- Fecha o rotulo do JavaScript -->

                    <label> <!-- Rotulo da quarta caixa de selecao -->

                        <input type="checkbox" name="conhecimentos" value="banco_dados"> Banco de Dados <!-- Caixa de multipla escolha para a opcao Banco de Dados -->

                    </label> <!-- Fecha o rotulo do Banco de Dados -->

                </div> <!-- Fecha a caixa do grupo de checkboxes -->

            </div> <!-- Fecha o grupo geral de conhecimentos -->


            <!-- 9. Por que deseja fazer o curso? -->

            <div class="form-group"> <!-- Agrupa o rotulo e a caixa de texto grande -->

                <label for="motivo">Por que deseja fazer o curso?</label> <!-- Rotulo de texto conectado a area de texto -->

                <textarea id="motivo" name="motivo" rows="4" placeholder="Conte-nos um pouco sobre suas motivações..."></textarea> <!-- Caixa de texto de multiplas linhas com altura inicial de 4 linhas -->

            </div> <!-- Fecha o grupo do motivo -->

            <!-- Desafio Extra: Termos de Inscricao -->

            <div class="form-group compliance"> <!-- Agrupa a caixa de aceitacao dos termos com classe especifica de conformidade -->

                <label> <!-- Rotulo que envolve o checkbox dos termos -->
    </body>
</html>
